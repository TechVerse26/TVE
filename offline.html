<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1B4D">
<meta name="robots" content="noindex">
<title>You're offline — Tech Verse Exam</title>
<!-- Shown by service-worker.js when a page cannot be loaded because the device is offline.
     Fully self-contained (no scripts, fonts or images from elsewhere) so it works with no connection at all. -->
<style>
  :root { --navy: #0A1B4D; --navy-2: #12307F; --accent: #1558E0; --text: #0B1B3F; --muted: #566884; --bg: #F3F6FC; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: var(--navy); color: #fff;
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans Bengali", "Hind Siliguri", sans-serif; line-height: 1.55;
  }
  main {
    width: min(100%, 420px); padding: 32px 24px 24px; text-align: center;
    background: #fff; color: var(--text); border-radius: 24px; box-shadow: 0 24px 64px rgba(0, 0, 0, 0.35);
  }
  .mark { display: block; margin: 0 auto 20px; border-radius: 20px; box-shadow: 0 2px 8px rgba(10, 27, 77, 0.25); }
  h1 { font-size: 1.5rem; line-height: 1.25; letter-spacing: -0.01em; }
  p { margin-top: 10px; font-size: 0.9375rem; color: var(--muted); overflow-wrap: anywhere; }
  button {
    margin-top: 22px; width: 100%; min-height: 48px; padding: 10px 20px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  button:hover { background: #0F47B8; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .note { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(15, 40, 100, 0.12); font-size: 0.8125rem; }
</style>
</head>
<body>
<main>
  <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <g transform="translate(0.000000,512.000000) scale(0.100000,-0.100000)" fill="currentColor" stroke="none">
    <path d="M1934 3527 c-2 -7 -3 -80 -2 -162 l3 -150 226 -3 226 -2 22 -208 c12 -114 33 -306 46 -427 28 -261 75 -734 75 -755 -1 -8 -15 23 -33 70 -85 223 -258 444 -487 621 -73 57 -281 201 -329 229 -13 7 17 42 147 173 l163 163 -42 38 -41 39 -101 -100 c-56 -54 -153 -148 -214 -208 -62 -60 -113 -111 -113 -114 0 -4 21 -19 48 -35 153 -96 368 -242 440 -301 106 -85 246 -225 324 -323 67 -84 152 -212 145 -218 -2 -3 -23 21 -47 51 -95 123 -287 278 -441 355 -73 37 -209 94 -322 135 l-87 31 35 58 34 57 -46 29 c-26 17 -49 30 -52 30 -6 0 -151 -233 -147 -237 1 -1 62 -21 136 -43 444 -136 735 -325 990 -643 30 -37 56 -67 59 -67 3 1 35 37 71 82 228 283 523 476 945 618 115 39 179 65 177 73 -3 10 -117 202 -128 216 -4 5 -59 -24 -88 -45 -17 -12 -17 -16 13 -65 18 -28 31 -53 29 -54 -2 -2 -57 -24 -123 -50 -169 -65 -344 -152 -455 -226 -89 -60 -261 -218 -324 -299 -25 -33 -26 -33 -12 -5 28 58 122 185 214 289 153 174 303 297 584 479 87 56 158 105 158 108 0 4 -96 99 -213 212 l-212 205 -25 -22 c-63 -55 -69 -42 105 -216 88 -88 157 -161 155 -163 -3 -2 -61 -42 -130 -88 -370 -249 -574 -476 -688 -769 -30 -76 -32 -80 -28 -40 29 241 98 918 132 1288 l7 72 218 0 219 0 0 165 0 165 -605 0 c-486 0 -607 -3 -611 -13z"/>
  </g>
</svg>
  <h1>You're offline</h1>
  <p>Tech Verse Exam needs an internet connection for live exams, your schedule and your results. Check your connection, then try again.</p>
  <button type="button" id="retry">Try again</button>
  <p class="note">If an exam attempt was in progress, it is saved on this device and will be waiting for you when you reconnect.</p>
</main>
<script>
  // Back online → load the real page again (the address is still the page that was requested).
  document.getElementById("retry").addEventListener("click", function () { window.location.reload(); });
  window.addEventListener("online", function () { window.location.reload(); });
</script>
</body>
</html>
