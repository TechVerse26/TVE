<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0; url=/index.html">
<title>Redirecting…</title>
<script>
  // GitHub-Pages-style SPA fallback: bounce any unknown path back to index.html
  // and preserve it as a hash route so the router picks it up.
  var path = window.location.pathname.replace(/^\//, "");
  window.location.replace("/index.html#/" + path + window.location.search);
</script>
</head>
<body></body>
</html>
