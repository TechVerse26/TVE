<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Tech Verse Exam</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="admin-gate" class="loading-screen"><span class="spinner"></span> Verifying access…</div>

<div class="admin-app hidden" id="admin-shell">
  <header class="admin-topbar">
    <div class="admin-topbar-left">
      <button type="button" class="admin-drawer-toggle" id="admin-drawer-toggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <a href="index.html" class="admin-brand" aria-label="Tech Verse Exam — site">
        <img src="assets/logo.svg" alt="" class="admin-brand-logo" width="120" height="28">
        <span class="admin-brand-name" id="admin-brand-name">Tech Verse Exam</span>
      </a>
      <span class="chip accent" id="admin-role-chip"></span>
    </div>
    <div class="admin-topbar-right">
      <a href="index.html" class="admin-topbar-link"><i class="fa-solid fa-arrow-up-right-from-square"></i><span>View site</span></a>
      <span class="nav-user-chip" title="Signed in as">
        <span class="nav-avatar" id="admin-user-avatar">?</span>
        <span id="admin-user-name">…</span>
      </span>
      <button type="button" class="admin-topbar-link" id="admin-logout-btn" title="Sign out"><i class="fa-solid fa-right-from-bracket"></i><span>Sign out</span></button>
    </div>
  </header>

  <div class="admin-sidebar-backdrop" id="admin-sidebar-backdrop"></div>

  <div class="admin-body">
    <aside class="admin-sidebar" id="admin-sidebar" aria-label="Admin navigation">
      <div class="admin-sidebar-mobile-head">
        <span>Menu</span>
        <button type="button" class="admin-drawer-close" id="admin-drawer-close" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <nav class="admin-nav" id="admin-nav"></nav>
    </aside>

    <main class="admin-main" id="admin-main">
      <!-- Pages are created by js/admin/admin.js the first time they are opened.
           Leaderboard keeps its original markup because js/admin/leaderboard.js binds to these ids. -->
      <section class="admin-section" id="section-leaderboard">
        <div class="page-head">
          <div><h1>Leaderboard</h1><p>Students ranked by the average of their best live-exam results.</p></div>
          <div class="page-actions">
            <button type="button" class="btn btn-teal btn-sm" id="lb-pdf-btn"><i class="fa-solid fa-file-pdf"></i> PDF</button>
            <button type="button" class="btn btn-outline btn-sm" id="lb-refresh-btn" title="Re-read from the database"><i class="fa-solid fa-arrow-rotate-right"></i></button>
          </div>
        </div>
        <div class="panel">
          <div class="toolbar">
            <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input type="search" id="lb-search" placeholder="Search name or email"></div>
          </div>
          <div class="tbl-wrap"><table class="data-table" id="leaderboard-table">
            <thead><tr><th>Rank</th><th>Student</th></tr></thead>
            <tbody><tr><td colspan="2"><div class="loading-screen"><span class="spinner"></span></div></td></tr></tbody>
          </table></div>
        </div>
      </section>
    </main>
  </div>
</div>

<noscript><p style="padding:24px">The admin panel needs JavaScript.</p></noscript>
<script type="module" src="js/admin/admin.js"></script>
</body>
</html>
