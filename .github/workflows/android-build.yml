# Builds the Tech Verse Exam Android app (mobile-app/) into an APK you can download.
#
# Free: uses only GitHub's included Actions minutes. It never runs on a schedule — only when YOU start it
# (Actions tab → "Android APK" → Run workflow) or when you push a tag that starts with "android-v".
# Every finished build is also published on the repository's Releases page, so the APK has a normal
# download link that works on a phone (no zip to unpack, no GitHub sign-in needed for a public repository).
# The website workflow (push-scheduler.yml) is a separate file and is not part of this build.
name: Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug = installable test APK · release = signed APK (needs the signing secrets, see mobile-app/docs/SIGNING.md)"
        type: choice
        options: [debug, release]
        default: debug
      publish:
        description: "Also publish the APK on the Releases page (public download link)"
        type: boolean
        default: true
  push:
    tags: ["android-v*"]

permissions:
  contents: write # lets the build publish the APK on the Releases page

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-app
    env:
      APP_ID: com.techverse.exam
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # All optional. Nothing secret is ever written to the repository or the log.
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide the build type
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then TYPE=release; else TYPE=debug; echo "::warning::No signing key secret found, so this tag build is a debug APK. See mobile-app/docs/SIGNING.md to enable release builds."; fi
          else
            TYPE="${{ inputs.build_type }}"
          fi
          if [ "$TYPE" = "release" ] && [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::A release APK needs the signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Follow mobile-app/docs/SIGNING.md, or run this workflow with build_type = debug."
            exit 1
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::notice::GOOGLE_SERVICES_JSON secret not set — the app will build, but push notifications stay off until you add it (mobile-app/ANDROID-FIREBASE.md)."; fi

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('mobile-app/package.json', 'mobile-app/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu runner already ships the Android SDK, so nothing has to be installed here.
      # Do NOT add android-actions/setup-android@v3 back: it asks sdkmanager for the old "tools" package,
      # Google has removed that package, and the whole job then fails before the build even starts.
      - name: Prepare the Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
          echo "Android SDK: $SDK"
          # Accept the SDK licences once so Gradle may download any missing SDK piece by itself.
          yes | timeout 180 "$SDKMANAGER" --licenses > /dev/null || true
          ls "$SDK/platforms" "$SDK/build-tools" 2>/dev/null || true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile-app/package.json', 'mobile-app/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # A debug APK is signed with ~/.android/debug.keystore. A fresh runner would invent a new one every time,
      # and Android refuses to update an app that was signed with a different key. Re-using one fixed, public
      # test key (password "android") lets each new test APK install over the previous one.
      # Release builds do not use it: they are signed with YOUR key from the secrets.
      - name: Use the fixed test-signing key
        run: |
          if [ -f resources/android/debug.keystore ]; then
            mkdir -p ~/.android
            cp resources/android/debug.keystore ~/.android/debug.keystore
            echo "Test builds are signed with the project's fixed test key."
          else
            echo "::notice::resources/android/debug.keystore not found, so this test APK gets a random key. Uninstall the older app before installing it."
          fi

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Tests (app rules + parity with the website's exam engine)
        run: npm test

      - name: Type check (reported, does not block the build)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build the web app
        run: npm run build

      - name: Create / update the Android project
        run: node scripts/android.mjs sync

      - name: Build the APK (${{ steps.kind.outputs.type }})
        run: node scripts/android.mjs build ${{ steps.kind.outputs.type }}

      - name: Validate the APK
        run: |
          set -euo pipefail
          APK=$(ls dist-apk/*.apk | head -n1)
          echo "APK: $APK"
          SIZE=$(stat -c%s "$APK")
          [ "$SIZE" -gt 2000000 ] || { echo "::error::The APK is suspiciously small ($SIZE bytes)."; exit 1; }
          ENTRIES=$(unzip -Z1 "$APK")
          grep -qx "classes.dex" <<< "$ENTRIES" || { echo "::error::classes.dex is missing from the APK."; exit 1; }
          grep -qx "assets/public/index.html" <<< "$ENTRIES" || { echo "::error::The web app (assets/public/index.html) is not inside the APK."; exit 1; }
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -n1)
          BADGING=$("$BT/aapt2" dump badging "$APK")
          grep -q "^package: name='$APP_ID'" <<< "$BADGING" || { echo "::error::Wrong Android package name (expected $APP_ID)."; exit 1; }
          grep -E "^(package|sdkVersion|targetSdkVersion|application-label):" <<< "$BADGING" || true
          "$BT/apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/apksigner.txt" 2>&1 || { cat "$RUNNER_TEMP/apksigner.txt"; echo "::error::The APK is not signed."; exit 1; }
          head -n 3 "$RUNNER_TEMP/apksigner.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: TechVerseExam-APK
          path: mobile-app/dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      # The download link: Releases page → newest entry → the .apk file. Works on a phone, no unzipping.
      - name: Publish to GitHub Releases
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.kind.outputs.type }}
        run: |
          set -euo pipefail
          APK=$(ls dist-apk/*.apk | head -n1)
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then TAG="$GITHUB_REF_NAME"; else TAG="build-$GITHUB_RUN_NUMBER"; fi
          TITLE="Tech Verse Exam $VERSION · build $GITHUB_RUN_NUMBER ($KIND)"
          NOTES=$(printf '%s\n' \
            "${KIND^} build · version $VERSION · build $GITHUB_RUN_NUMBER · commit ${GITHUB_SHA::7}" \
            "" \
            "How to install: open this page on your phone, tap the .apk file below, and allow \"Install unknown apps\" when Android asks." \
            "" \
            "If Android says \"App not installed\" and an older copy is on the phone, uninstall the old app once, then install again.")
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES" --latest
          fi
          {
            echo "### ✅ APK ready"
            echo ""
            echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          } >> "$GITHUB_STEP_SUMMARY"
