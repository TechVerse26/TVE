# Optional free scheduler for Tech Verse Exam push notifications (use this OR cron-job.org — not both needed).
# It wakes the API every ~5 minutes so scheduled notifications go out on time.
#
# One-time setup: GitHub → repository → Settings → Secrets and variables → Actions → New repository secret
#   PUSH_CRON_URL     https://YOUR-SITE.vercel.app/api/push/cron
#   PUSH_CRON_SECRET  the same text you saved as CRON_SECRET in Vercel
# Without those two secrets this workflow simply does nothing.
#
# Note: GitHub may delay scheduled runs by several minutes, and pauses them in a repository with no activity for 60 days.
name: push-scheduler
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake the push scheduler
        env:
          PUSH_CRON_URL: ${{ secrets.PUSH_CRON_URL }}
          PUSH_CRON_SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          if [ -z "$PUSH_CRON_URL" ] || [ -z "$PUSH_CRON_SECRET" ]; then
            echo "Push scheduler secrets are not set — nothing to do."
            exit 0
          fi
          case "$PUSH_CRON_URL" in https://*) ;; *) echo "PUSH_CRON_URL must start with https://"; exit 1 ;; esac
          CODE=$(curl --silent --show-error --max-time 30 --retry 2 -o "$RUNNER_TEMP/cron.txt" -w '%{http_code}' \
            -H "Authorization: Bearer ${PUSH_CRON_SECRET}" "$PUSH_CRON_URL" || true)
          echo "HTTP ${CODE:-000}"
          # The server answers with a tiny JSON line ({"ok":true,...} or {"ok":false,"error":{"code":"..."}}) that never holds a secret.
          head -c 400 "$RUNNER_TEMP/cron.txt" 2>/dev/null || true
          echo
          case "$CODE" in
            2??) ;;
            401|403) echo "::error::HTTP $CODE - the secret was refused. PUSH_CRON_SECRET (GitHub) must be exactly the same text as CRON_SECRET in Vercel."; exit 1 ;;
            404) echo "::error::HTTP 404 - nothing answers at PUSH_CRON_URL. It must be https://YOUR-VERCEL-SITE/api/push/cron (GitHub Pages cannot run the push API)."; exit 1 ;;
            503) echo "::error::HTTP 503 - the push server is not fully set up (CRON_SECRET or the Firebase service-account variables are missing in Vercel). Read the JSON line above."; exit 1 ;;
            *) echo "::error::HTTP ${CODE:-000} - the scheduler call failed. Read the JSON line above (000 = the host could not be reached)."; exit 1 ;;
          esac
