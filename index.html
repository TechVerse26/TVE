<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14151E">
<title>Tech Verse Exam</title>
<meta name="description" content="Tech Verse Exam — live exams, practice, schedule, results and leaderboard for students">
<link rel="icon" href="assets/favicon.ico">
<link rel="preload" href="assets/logo.svg" as="image" type="image/svg+xml">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/exam.css">
<link rel="stylesheet" href="css/profile.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/results.css">
</head>
<body class="site-body">

<div id="topnav-root"></div>

<!-- Exam section shell — persistent across #/home, #/exam?course=, #/exam?id= visits.
     Flow for #/exam?id=xxx: exam-list-view → exam-verify-view (checklist + rules gate)
     → exam-take-view → exam-result-view. -->
<div id="page-exam" class="hidden exam-shell">
  <main class="container page">
    <div id="exam-list-view" class="exam-list-view">
      <header class="page-head">
        <div class="page-head-text">
          <button type="button" id="exam-back-btn" class="exs-back-btn hidden"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Course List </button>
          <h1 class="page-title" id="exam-section-title">Verify yourself.</h1>
          <p class="page-desc" id="exam-section-sub">Take the exam for your enrolled course, see your score.</p>
        </div>
      </header>
      <div class="exam-grid" id="exam-grid"></div>
    </div>

    <div id="exam-verify-view" class="exs-verify-wrap hidden"></div>

    <div id="exam-take-view" class="exam-take-wrap hidden">
      <div class="exam-sticky-bar">
        <div class="exam-top-bar">
          <h2 id="exam-take-title">Exam</h2>
          <div class="exam-timer" id="exam-timer"><i class="fa-solid fa-stopwatch"></i><span class="exam-timer-value">00:00</span></div>
        </div>
        <div class="q-progress-track"><div class="q-progress-fill" id="q-progress-fill"></div></div>
      </div>
      <form id="exam-submit-form">
        <div id="question-area"></div>
        <div class="exam-nav-row">
          <button type="button" class="btn btn-outline" id="q-prev"><i class="fa-solid fa-arrow-left"></i> Previous</button>
          <button type="button" class="btn btn-primary" id="q-next">Next <i class="fa-solid fa-arrow-right"></i></button>
          <button type="submit" class="btn btn-teal hidden" id="q-submit">Submit</button>
        </div>
      </form>
    </div>

    <div id="exam-result-view" class="exam-take-wrap hidden"></div>
  </main>
</div>

<!-- Generic single-mount shell — login / signup / my-results / 404 -->
<div id="page-generic" class="hidden">
  <div id="generic-page-content" role="main"></div>
</div>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>&copy; <span id="footer-year"></span> Tech Verse — All Rights Reserved</span>
  </div>
</footer>

<script>document.getElementById("footer-year").textContent = new Date().getFullYear();</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
